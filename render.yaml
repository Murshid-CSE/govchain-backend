services:
  # GovChain Backend REST API (Staging / Production)
  - type: web
    name: govchain-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Configured in Render Dashboard with Neon pooled connection string (?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        sync: false # Exact frontend origin only (never wildcard *), e.g. https://govchain.vercel.app
      - key: REQUIRE_OBJECT_STORAGE
        value: "true"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
