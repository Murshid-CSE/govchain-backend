version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: govchain_postgres
    restart: always
    environment:
      POSTGRES_USER: govchain_user
      POSTGRES_PASSWORD: govchain_dev_password
      POSTGRES_DB: govchain_dev
    ports:
      - '5432:5432'
    volumes:
      - govchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U govchain_user -d govchain_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  govchain_pgdata:
    driver: local
