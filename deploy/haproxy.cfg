global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend gateway
    bind :8080
    http-request set-header X-Forwarded-For %[src]
    stick-table type ip size 100k expire 15m store http_req_rate(15m)
    http-request track-sc0 src unless { path_beg /api/v1/health }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 } !{ path_beg /api/v1/health }
    default_backend govchain

backend govchain
    balance roundrobin
    option httpchk GET /api/v1/health/ready
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 resolvers docker init-addr libc,none
    server api1 api1:5000 check
    server api2 api2:5000 check

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
