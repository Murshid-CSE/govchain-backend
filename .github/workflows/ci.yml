name: GovChain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend API & Database Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: govchain_user
          POSTGRES_PASSWORD: govchain_dev_password
          POSTGRES_DB: govchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations to CI database
        env:
          DATABASE_URL: postgresql://govchain_user:govchain_dev_password@localhost:5432/govchain_test?schema=public
        run: npx prisma migrate deploy

      - name: Run backend & database integration tests
        env:
          DATABASE_URL: postgresql://govchain_user:govchain_dev_password@localhost:5432/govchain_test?schema=public
          JWT_SECRET: ci_secret_key_govchain_test_environment_32_chars_long
          NODE_ENV: test
        run: npm test

      - name: Install frontend dependencies
        run: npm --prefix client ci

      - name: Production frontend build & typecheck
        run: npm run build

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run real browser E2E tests (Playwright Chromium)
        env:
          DATABASE_URL: postgresql://govchain_user:govchain_dev_password@localhost:5432/govchain_test?schema=public
          JWT_SECRET: ci_secret_key_govchain_test_environment_32_chars_long
          NODE_ENV: test
        run: |
          npm run seed
          node server.js &
          npm run client:dev &
          sleep 5
          npm run test:e2e
